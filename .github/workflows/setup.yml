name: setup

on:
  workflow_call:
    inputs:
      ros_distro:
        required: true
        type: string

jobs:
  setup:
    runs-on: ubuntu-latest
    # Overall backstop so a hung build/run can't burn CI minutes indefinitely.
    # Setup/build plus three per-step timeouts (8 + 8 + 5) can add up to ~35 min worst case.
    timeout-minutes: 40
    # The ROS image fixes the Ubuntu base: jazzy -> 24.04, lyrical -> 26.04.
    container:
      image: ros:${{ inputs.ros_distro }}
    steps:
      - name: Install system packages required by script-setup
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ant build-essential ca-certificates cmake default-jre git \
            libegl-dev libeigen3-dev libgl-dev libglfw3-dev liborocos-kdl-dev \
            libprotobuf-dev libtomlplusplus-dev liburdfdom-dev liburdfdom-headers-dev make ninja-build \
            pkg-config protobuf-compiler python3-pip python3-venv \
            python3-colcon-common-extensions python3-rosdep python3-vcstool unzip \
            ros-${{ inputs.ros_distro }}-rclcpp ros-${{ inputs.ros_distro }}-realtime-tools

      - name: Install uv
        # script-setup requires uv for the workspace venv. Not an apt package on either
        # base, and the ROS images are PEP 668 externally-managed, hence the explicit flag.
        run: pip3 install --no-cache-dir --break-system-packages uv

      - name: Checkout grc_meta
        uses: actions/checkout@v4
        with:
          path: ws/src/grc_meta

      - name: Authenticate to private workspace repos
        env:
          TOKEN: ${{ secrets.WORKSPACE_REPOS_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            git config --global \
              url."https://x-access-token:${TOKEN}@github.com/".insteadOf "https://github.com/"
          else
            echo "No WORKSPACE_REPOS_TOKEN set; assuming the workspace repos are public."
          fi

      - name: Initialize rosdep
        run: rosdep init 2>/dev/null || true

      - name: Run script-setup
        env:
          GRC_GIT_TRANSPORT: https
          # Kortex/Robotiq backends on: real_demo_monitor targets real hardware and
          # needs them to build. Kortex's SDK download is an unauthenticated public
          # URL (artifactory.kinovaapps.com/.../generic-public/...), no secret needed.
          GRC_COLCON_META: ${{ github.workspace }}/ws/src/grc_meta/colcon.ci.meta
        run: ws/src/grc_meta/script-setup --clean ws "${{ inputs.ros_distro }}"

      - name: Install STST code-generation tool
        shell: bash
        run: |
          source ws/setup-grc.bash
          motion-spec setup --prefix "$GRC_WS"

      - name: Run pick-place example (headless)
        # gen + build + run of one controller. --steps is the safety cap (1 ms
        # timestep); the run self-terminates at S_DONE well before it. Wall-clock
        # timeout is the backstop against a deadlock that never advances.
        timeout-minutes: 8
        shell: bash
        run: |
          source ws/setup-grc.bash
          motion-spec run \
            "$GRC_WS/src/motion-spec-dsl/models/pick_place_single/pick_place_single.robmot" \
            --prefix "$GRC_WS/install" --cwd "$GRC_WS" --headless --steps 60000 2>&1 | tee run.log
          grep -q '/S_DONE' run.log || { echo "::error::pick-place FSM did not reach S_DONE"; exit 1; }

      - name: Run admittance-arc example (headless)
        # Same pattern as pick-place; completes in ~24k steps, 60000 keeps the
        # same safety margin.
        timeout-minutes: 8
        shell: bash
        run: |
          source ws/setup-grc.bash
          motion-spec run \
            "$GRC_WS/src/motion-spec-dsl/models/admittance_arc_single/admittance_arc_single.robmot" \
            --prefix "$GRC_WS/install" --cwd "$GRC_WS" --headless --steps 60000 2>&1 | tee run.log
          grep -q '/S_DONE' run.log || { echo "::error::admittance-arc FSM did not reach S_DONE"; exit 1; }

      - name: Build real_demo_monitor (gen+build only)
        # Targets real hardware (Kinova/Robotiq), so it can't run headlessly in
        # CI; verify codegen and compilation only.
        timeout-minutes: 5
        shell: bash
        run: |
          source ws/setup-grc.bash
          cd "$GRC_WS/src/motion-spec-dsl/models/real_demo_monitor"
          gen_dir="$(motion-spec gen code real_demo_monitor.robmot -o ci_build | tail -1)"
          motion-spec build "$gen_dir" --prefix "$GRC_WS/install"
