name: setup

on:
  workflow_call:
    inputs:
      ros_distro:
        required: true
        type: string

jobs:
  setup:
    runs-on: ubuntu-latest
    # Overall backstop so a hung build/run can't burn CI minutes indefinitely.
    timeout-minutes: 20
    # The ROS image fixes the Ubuntu base: jazzy -> 24.04, lyrical -> 26.04.
    container:
      image: ros:${{ inputs.ros_distro }}
    steps:
      - name: Install system packages required by script-setup
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ant build-essential ca-certificates cmake default-jre git \
            libegl-dev libeigen3-dev libgl-dev libglfw3-dev liborocos-kdl-dev \
            libprotobuf-dev liburdfdom-dev liburdfdom-headers-dev make ninja-build \
            pkg-config protobuf-compiler python3-pip python3-venv \
            python3-colcon-common-extensions python3-rosdep python3-vcstool

      - name: Checkout grc_meta
        uses: actions/checkout@v4
        with:
          path: ws/src/grc_meta

      - name: Authenticate to private workspace repos
        env:
          TOKEN: ${{ secrets.WORKSPACE_REPOS_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            git config --global \
              url."https://x-access-token:${TOKEN}@github.com/".insteadOf "https://github.com/"
          else
            echo "No WORKSPACE_REPOS_TOKEN set; assuming the workspace repos are public."
          fi

      - name: Initialize rosdep
        run: rosdep init 2>/dev/null || true

      - name: Run script-setup
        env:
          GRC_GIT_TRANSPORT: https
          # Build without the Kinova Kortex hardware backend: the sim pipeline
          # doesn't need it, and its auto-download hits a proprietary artifactory.
          GRC_COLCON_META: ${{ github.workspace }}/ws/src/grc_meta/colcon.ci.meta
        run: ws/src/grc_meta/script-setup --clean ws "${{ inputs.ros_distro }}"

      - name: Install STST code-generation tool
        shell: bash
        run: |
          source ws/setup-grc.bash
          motion-spec setup --prefix "$GRC_WS"

      - name: Run pick-place example (headless)
        # gen + build + run of one controller; cap it so a deadlock (which won't
        # reach S_DONE) fails fast instead of hanging.
        timeout-minutes: 4
        shell: bash
        run: |
          source ws/setup-grc.bash
          motion-spec run \
            "$GRC_WS/src/motion-spec-dsl/models/pick_place_single/pick_place_single.robmot" \
            --prefix "$GRC_WS/install" --cwd "$GRC_WS" --headless 2>&1 | tee run.log
          grep -q '/S_DONE' run.log || { echo "::error::pick-place FSM did not reach S_DONE"; exit 1; }
